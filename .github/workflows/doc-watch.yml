name: doc-watch

# Daily check: has any Claude Code doc page that Claudit's guidance depends on changed
# since it was last verified? Opens/updates a `doc-drift` issue per changed page. It never
# edits the repo — a human re-verifies and releases.
#
# Note: GitHub disables scheduled workflows in public repos after 60 days without repo
# activity. Re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than moving tags — see validate.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check doc pages and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python maintainer/doc_watch.py --github
